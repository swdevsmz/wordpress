# Xdebug 拡張を読み込む。
zend_extension=xdebug

# ステップ実行デバッグを有効にする。
xdebug.mode=debug

# HTTP リクエストごとに自動でデバッグ接続を開始する。
xdebug.start_with_request=yes

# Xdebug から接続する VS Code 側のホスト。
# Podman/WSL 環境では host.containers.internal が Podman 側を指すため、
# Windows 側の VS Code に届く WSL ゲートウェイ IP を指定している。
# macOS + Podman の場合は host.containers.internal で Mac 側の VS Code に
# 届くことが多いので、つながらない場合だけ Podman machine のゲートウェイ IP を確認する。
xdebug.client_host=172.30.96.1

# VS Code の PHP Debug 拡張が待ち受けるポート。Xdebug 3 の標準は 9003。
xdebug.client_port=9003

# IDE 側で識別に使われるキー。VS Code の PHP Debug と合わせている。
xdebug.idekey=VSCODE

# 接続失敗などの調査用ログ。止まらないときはまずこのファイルを見る。
xdebug.log=/tmp/xdebug.log

# ブラウザの接続元から IDE を推測せず、client_host の値を固定して使う。
xdebug.discover_client_host=false
